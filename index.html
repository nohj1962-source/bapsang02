<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 밥상</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 32px 16px;
    font-family: "Gowun Batang", "Nanum Myeongjo", "Malgun Gothic", "Apple SD Gothic Neo", serif;
    color: #4a2f1b;
    background: radial-gradient(circle at 50% 30%, #fbf1dc 0%, #f1dfbf 60%, #e6cfa6 100%);
  }

  header { text-align: center; }
  h1 { font-size: clamp(28px, 5vw, 40px); letter-spacing: 0.12em; color: #7a2e1d; }
  header p { margin-top: 8px; font-size: 15px; color: #8a6a4a; }

  /* 둥근 상 */
  .sang {
    position: relative;
    width: min(86vw, 70vh, 540px);
    aspect-ratio: 1;
    border-radius: 50%;
    list-style: none;
    background:
      repeating-radial-gradient(circle at 50% 50%, rgba(90, 45, 15, 0.07) 0 2px, transparent 2px 15px),
      radial-gradient(circle at 38% 32%, #c98a4e 0%, #a9682f 55%, #8a4f20 100%);
    border: 12px solid #6e3a17;
    box-shadow:
      inset 0 0 0 4px rgba(255, 220, 170, 0.25),
      inset 0 0 50px rgba(60, 25, 5, 0.35),
      0 22px 40px rgba(90, 50, 20, 0.35);
  }

  /* 반찬 카드 */
  .sang li {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 27%;
    aspect-ratio: 4 / 5;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6%;
    background: #fffaf0;
    border: 2px solid #e2c9a1;
    border-radius: 16px;
    box-shadow: 0 6px 14px rgba(50, 20, 5, 0.35);
    font-size: clamp(15px, 2.6vw, 20px);
    font-weight: 700;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .sang li::before {
    content: attr(data-emoji);
    font-size: 2.6em;
    line-height: 1;
  }
  .sang li:hover {
    transform: translate(-50%, -56%);
    box-shadow: 0 12px 20px rgba(50, 20, 5, 0.4);
  }

  footer { font-size: 14px; color: #8a6a4a; }
</style>
</head>
<body>

  <header>
    <h1>오늘의 밥상</h1>
    <p>따뜻한 밥 한 끼, 맛있게 드세요</p>
  </header>

  <!--
    ▼ 반찬 목록 ▼
    아래에 한 줄씩 추가하면 상 위에 카드가 자동으로 놓입니다.
    형식:  <li data-emoji="이모지">이름</li>
    예시:  <li data-emoji="🍳">계란말이</li>
  -->
  <ul class="sang" id="sang">
    <li data-emoji="🍚">밥</li>
    <li data-emoji="🍲">국</li>
    <li data-emoji="🥬">김치</li>
    <li data-emoji="🍖">돈까스</li>
    <li data-emoji="🥘">육개장</li>
    <li data-emoji="🐟">꽁치</li>
  </ul>

  <footer>잘 먹겠습니다 🙏</footer>

<script>
  // 카드를 상 위에 둥글게 배치합니다. (반찬 개수에 맞춰 자동 조정)
  (function () {
    var cards = document.querySelectorAll('#sang li');
    var n = cards.length;
    if (n < 2) return;                      // 1개면 가운데에 그대로
    var radius = n < 4 ? 27 : n <= 6 ? 29 : 33; // 상 중심에서의 거리(%)
    var width = n <= 4 ? 27 : Math.max(15, 27 - (n - 4) * 2.5); // 많아지면 카드를 작게
    cards.forEach(function (card, i) {
      var angle = -Math.PI / 2 + (2 * Math.PI * i) / n;  // 맨 위부터 시계 방향
      card.style.left = 50 + radius * Math.cos(angle) + '%';
      card.style.top = 50 + radius * Math.sin(angle) + '%';
      card.style.width = width + '%';
      if (n > 4) card.style.fontSize = 'clamp(12px, 2vw, 16px)';
    });
  })();
</script>
</body>
</html>
